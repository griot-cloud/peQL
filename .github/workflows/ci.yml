name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  engine:
    name: fmt · clippy · test · examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Access to parcel (only needed while griot-cloud/parcel is private)
        env:
          TOKEN: ${{ secrets.PARCEL_READ_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/griot-cloud/parcel".insteadOf "https://github.com/griot-cloud/parcel"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features platform -- -D warnings
      - run: cargo test --features platform
      - name: Examples, including the parcel handoff
        run: |
          cargo build --bin peql
          cargo install --locked --git https://github.com/griot-cloud/parcel parcel-cli
          PEQL=$PWD/target/debug/peql PARCEL=parcel examples/run-all.sh

  lance:
    name: lance feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Access to parcel (only needed while griot-cloud/parcel is private)
        env:
          TOKEN: ${{ secrets.PARCEL_READ_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/griot-cloud/parcel".insteadOf "https://github.com/griot-cloud/parcel"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features lance -- -D warnings
      - run: cargo test --features lance --test lance

  python:
    name: python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - name: Access to parcel (only needed while griot-cloud/parcel is private)
        env:
          TOKEN: ${{ secrets.PARCEL_READ_TOKEN }}
        if: env.TOKEN != ''
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/griot-cloud/parcel".insteadOf "https://github.com/griot-cloud/parcel"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - run: python -m pip install maturin pyarrow pytest
      - run: maturin build --out dist && python -m pip install dist/*.whl
      - run: python -m pytest -q
