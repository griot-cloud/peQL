# Python bindings for peQL (PyO3 + maturin). Its own workspace, so it does not entangle the
# engine's build.

[package]
name = "peql-python"
version = "0.4.1"
edition = "2024"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
peql = { path = "../.." }
parcel-runtime = { git = "https://github.com/griot-cloud/parcel", rev = "ccdd702" }
datafusion = "55.1.0"
serde_json = "1"
pyo3 = { version = "0.27", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
