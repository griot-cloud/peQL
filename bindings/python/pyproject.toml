[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "peql"
version = "0.3.0"
description = "peQL — a contract-resolving, privacy-enforcing SQL engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "TBD" }
keywords = ["sql", "datafusion", "data-contract", "privacy", "governance", "arrow"]
dependencies = ["pyarrow>=14"]

[project.urls]
Source = "https://github.com/griot-cloud/peQL"

[tool.maturin]
module-name = "peql._native"
python-source = "python"
features = ["pyo3/extension-module"]
