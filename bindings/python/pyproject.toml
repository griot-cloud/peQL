[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "peql"
version = "0.4.0"
description = "peQL: a query engine where every table is a parcel data contract"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["sql", "datafusion", "data-contract", "privacy", "governance", "arrow"]
dependencies = ["pyarrow>=14"]

[project.urls]
Source = "https://github.com/griot-cloud/peql"

[tool.maturin]
module-name = "peql._native"
python-source = "python"
features = ["pyo3/extension-module"]
