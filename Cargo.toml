# peQL: the runtime for parcel data contracts.
#
# parcel (github.com/griot-cloud/parcel) compiles a contract into artifacts; peQL stores
# them, writes data under them, and answers SQL in which every table is a contract.

[package]
name = "peql"
version = "0.4.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/griot-cloud/peql"
description = "peQL: a query engine where every table is a parcel data contract"

[features]
default = []
# Serve Flight SQL over tonic on a listener the caller supplies (Unix socket, TCP, ...).
flight = ["dep:arrow-flight", "dep:tonic", "dep:prost", "dep:tokio-stream", "dep:tempfile"]
# Bindings in Amazon S3 and S3-compatible stores (`s3://bucket/prefix/`).
s3 = ["object_store/aws"]
# Lance datasets read from a path or URI.
lance = ["dep:lance", "dep:arrow-ipc-lance"]
# Contracts bound to Iceberg tables, through an Iceberg catalog the caller supplies.
iceberg = ["dep:iceberg", "dep:datafusion-iceberg"]

[lib]
name = "peql"
path = "src/lib.rs"

[[bin]]
name = "peql"
path = "src/bin/peql.rs"

[dependencies]
tempfile = { version = "3", optional = true }
parcel-core = { git = "https://github.com/griot-cloud/parcel", rev = "0af4c09" }
parcel-runtime = { git = "https://github.com/griot-cloud/parcel", rev = "0af4c09" }
datafusion = "55.1.0"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
hex = "0.4"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
lru = "0.12"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

# Bindings in object stores. DataFusion 55 reads through object_store 0.13, so this is its.
object_store = { version = "0.13", default-features = false }

# flight: the versions arrow-flight 59 (Arrow 59, DataFusion 55) is built on.
arrow-flight = { version = "59.3", features = ["flight-sql"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport"], optional = true }
prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }

# lance: its Arrow is one version behind DataFusion 55's, so batches cross by Arrow IPC.
lance = { version = "12", default-features = false, optional = true }
arrow-ipc-lance = { package = "arrow-ipc", version = "58", optional = true }

# iceberg: exact commits. The released crates (0.10) target DataFusion 53; these are the
# commits whose DataFusion (55) and Arrow (59) are peQL's. datafusion-iceberg pins the same
# iceberg commit, so the two move together.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "8cb2adeddb4f8da1ca7bd86ca303337f011c12e2", optional = true }
datafusion-iceberg = { git = "https://github.com/apache/datafusion-iceberg", rev = "a2bc9427d0659591b5f8122b90fec710fe2f5de6", optional = true }

# The `peql` binary restores the default SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wat = "1"
# A Flight SQL client over a Unix socket, in the flight tests.
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

# DataFusion is large; full debug info for every dependency fills disks quickly.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

