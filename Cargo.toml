# peQL: the runtime for parcel data contracts.
#
# parcel (github.com/griot-cloud/parcel) compiles a contract into artifacts; peQL stores
# them, writes data under them, and answers SQL in which every table is a contract.

[package]
name = "peql"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/griot-cloud/peql"
description = "peQL: a query engine where every table is a parcel data contract"

[features]
default = []
# Griot platform adapters: signed parcel bundles over HTTP (T03) and result signing (T05).
platform = ["dep:reqwest", "dep:p256"]
# Lance datasets read through the T04 storaged socket.
lance = ["dep:lance", "dep:lance-io", "dep:object_store", "dep:arrow-ipc-lance", "dep:url"]

[lib]
name = "peql"
path = "src/lib.rs"

[[bin]]
name = "peql"
path = "src/bin/peql.rs"

[dependencies]
parcel-core = { git = "https://github.com/griot-cloud/parcel", branch = "main" }
parcel-runtime = { git = "https://github.com/griot-cloud/parcel", branch = "main" }
datafusion = "55.1.0"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
hex = "0.4"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
lru = "0.12"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

# platform
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }

# lance: its Arrow is one version behind DataFusion 55's, so batches cross by Arrow IPC.
lance = { version = "12", default-features = false, optional = true }
lance-io = { version = "12", default-features = false, optional = true }
object_store = { version = "0.14", optional = true }
arrow-ipc-lance = { package = "arrow-ipc", version = "58", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
wat = "1"

# DataFusion is large; full debug info for every dependency fills disks quickly.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
